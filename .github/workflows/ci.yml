name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  # Never cancel a main run: it may be mid-deploy against the live VPS.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  NODE_VERSION: '22'

jobs:
  quality:
    name: Typecheck · Lint · Unit · Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # Version comes from "packageManager" in package.json — passing it here
      # too makes pnpm/action-setup v6 fail with "Multiple versions specified".
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm db:generate
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm build

  integration:
    name: Migrate · Seed · Integration + E2E
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: fca
          POSTGRES_PASSWORD: fca_ci_password
          POSTGRES_DB: fca_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U fca -d fca_test"
          --health-interval 10s --health-timeout 5s --health-retries 5
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s --health-timeout 5s --health-retries 5
    env:
      DATABASE_URL: postgresql://fca:fca_ci_password@localhost:5432/fca_test?schema=public
      TEST_DATABASE_URL: postgresql://fca:fca_ci_password@localhost:5432/fca_test?schema=public
      REDIS_URL: redis://localhost:6379
      JWT_ACCESS_SECRET: ci_access_secret_ci_access_secret_0123456789
      JWT_REFRESH_SECRET: ci_refresh_secret_ci_refresh_secret_0123456789
      NODE_ENV: test
    steps:
      - uses: actions/checkout@v7
      # Version comes from "packageManager" in package.json — passing it here
      # too makes pnpm/action-setup v6 fail with "Multiple versions specified".
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build workspace libraries (shared + database + ai + analytics dist, prisma client)
        run: pnpm --filter @fca/shared build && pnpm --filter @fca/database build && pnpm --filter @fca/ai build && pnpm --filter @fca/analytics build
      - name: Apply migrations
        run: pnpm db:migrate:deploy
      - name: Seed development data
        run: pnpm db:seed
      - name: Run API integration + e2e tests
        run: pnpm --filter @fca/api test

  # Deployment is PULL-based: the VPS polls GitHub every 2 minutes and deploys
  # commits whose checks are green (deploy/poll-deploy.sh + systemd timer).
  # There is deliberately no deploy job here — GitHub-hosted runners are
  # intermittently unable to reach the box at all (sshd logs no attempt, and
  # port 443 times out too), so pushing from CI was unreliable by nature.
  # Watch a deploy with:  journalctl -u fca-lms-deploy -f

  images:
    name: Build container images
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      # Built but not pushed: this proves the Dockerfiles work end to end
      # (workspace install, Prisma generate, Next standalone) on every change.
      - name: Build API image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: apps/api/Dockerfile
          push: false
          cache-from: type=gha,scope=api
          cache-to: type=gha,scope=api,mode=max
      - name: Build worker image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: apps/worker/Dockerfile
          push: false
          cache-from: type=gha,scope=worker
          cache-to: type=gha,scope=worker,mode=max
      - name: Build web image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: apps/web/Dockerfile
          push: false
          cache-from: type=gha,scope=web
          cache-to: type=gha,scope=web,mode=max
