name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  # Never cancel a main run: it may be mid-deploy against the live VPS.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  NODE_VERSION: '22'
  PNPM_VERSION: '9.12.0'

jobs:
  quality:
    name: Typecheck · Lint · Unit · Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm db:generate
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm build

  integration:
    name: Migrate · Seed · Integration + E2E
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: fca
          POSTGRES_PASSWORD: fca_ci_password
          POSTGRES_DB: fca_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U fca -d fca_test"
          --health-interval 10s --health-timeout 5s --health-retries 5
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s --health-timeout 5s --health-retries 5
    env:
      DATABASE_URL: postgresql://fca:fca_ci_password@localhost:5432/fca_test?schema=public
      TEST_DATABASE_URL: postgresql://fca:fca_ci_password@localhost:5432/fca_test?schema=public
      REDIS_URL: redis://localhost:6379
      JWT_ACCESS_SECRET: ci_access_secret_ci_access_secret_0123456789
      JWT_REFRESH_SECRET: ci_refresh_secret_ci_refresh_secret_0123456789
      NODE_ENV: test
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build workspace libraries (shared + database + ai + analytics dist, prisma client)
        run: pnpm --filter @fca/shared build && pnpm --filter @fca/database build && pnpm --filter @fca/ai build && pnpm --filter @fca/analytics build
      - name: Apply migrations
        run: pnpm db:migrate:deploy
      - name: Seed development data
        run: pnpm db:seed
      - name: Run API integration + e2e tests
        run: pnpm --filter @fca/api test

  deploy:
    name: Deploy LMS to VPS
    # Only after tests are green, and only for pushes to main. A red build
    # never reaches production.
    needs: [quality, integration]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    steps:
      # Until the three VPS secrets are configured, skip rather than fail red.
      - name: Check deploy credentials
        id: creds
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
        run: |
          if [ -n "$VPS_HOST" ] && [ -n "$SSH_KEY" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::notice::VPS secrets not configured — skipping deploy. Add VPS_HOST, VPS_SSH_KEY, VPS_KNOWN_HOSTS."
          fi

      - name: Deploy over SSH
        if: steps.creds.outputs.ready == 'true'
        env:
          SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
          VPS_HOST: ${{ secrets.VPS_HOST }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          # Pin the host key rather than disabling host verification.
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts
          # This key is pinned to a forced command in authorized_keys, so it can
          # ONLY run deploy.sh — the command sent here is ignored by the server.
          # A leaked key therefore cannot touch nginx, the landing page, or
          # anything else on the box.
          ssh -i ~/.ssh/deploy_key -o BatchMode=yes -o ConnectTimeout=30 \
              "root@${VPS_HOST}" 'deploy' 2>&1 | tee deploy.log
          rm -f ~/.ssh/deploy_key

      - name: Verify public endpoints
        if: steps.creds.outputs.ready == 'true'
        run: |
          fail=0
          check() {
            code=$(curl -s -o /dev/null -m 20 -w '%{http_code}' "$1")
            printf '%-46s %s\n' "$1" "$code"
            [ "$code" = "$2" ] || { echo "  expected $2"; fail=1; }
          }
          echo "--- LMS ---"
          check https://lms.futurecorpacademy.in/ 200
          check https://lms-api.futurecorpacademy.in/health 200
          echo "--- Landing page and legacy API must be unaffected ---"
          check https://futurecorpacademy.in/ 200
          check https://www.futurecorpacademy.in/ 200
          exit $fail

  images:
    name: Build container images
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      # Built but not pushed: this proves the Dockerfiles work end to end
      # (workspace install, Prisma generate, Next standalone) on every change.
      - name: Build API image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/api/Dockerfile
          push: false
          cache-from: type=gha,scope=api
          cache-to: type=gha,scope=api,mode=max
      - name: Build worker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/worker/Dockerfile
          push: false
          cache-from: type=gha,scope=worker
          cache-to: type=gha,scope=worker,mode=max
      - name: Build web image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/web/Dockerfile
          push: false
          cache-from: type=gha,scope=web
          cache-to: type=gha,scope=web,mode=max
